<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JotaPlayer🎵</title>
  
  <!-- Linhas obrigatórias para o PWA / PWABuilder -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#121212">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body class="dark-theme">

  <div class="glass-container">
    
    <!-- Navegação por Abas (Inferior) -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="tab-player">▶ Tocador</button>
      <button class="tab-btn" data-tab="tab-library">🎵 Biblioteca</button>
      <button class="tab-btn" data-tab="tab-settings">⚙️ Ajustes</button>
    </nav>

    <!-- CONTEÚDO DAS ABAS -->
    <div class="tab-content">

      <!-- ABA 1: PLAYER DEDICADO -->
      <section id="tab-player" class="tab-pane active">
        <div class="player-view">
          
          <div class="album-cover-wrapper">
            <div id="cover-art" class="album-cover">
              <span class="cover-placeholder">🎵</span>
            </div>
          </div>

          <div class="track-details">
            <h2 id="player-title">Nenhuma faixa selecionada</h2>
            <p id="player-artist">Carregue suas músicas na biblioteca</p>
          </div>

          <div class="progress-section">
            <span id="current-time">0:00</span>
            <input type="range" id="seek-bar" value="0" max="100" step="0.1">
            <span id="duration-time">0:00</span>
          </div>

          <div class="controls-row">
            <button id="btn-prev" class="control-btn" title="Anterior">⏮</button>
            <button id="btn-play" class="control-btn play-btn" title="Play/Pause">▶</button>
            <button id="btn-next" class="control-btn" title="Próxima">⏭</button>
          </div>

          <div class="volume-section">
            <span>🔊</span>
            <input type="range" id="volume-bar" value="100" max="100">
          </div>

        </div>
      </section>

      <!-- ABA 2: BIBLIOTECA DE MÚSICAS -->
      <section id="tab-library" class="tab-pane">
        <header class="library-header">
          <h3>Sua Coleção</h3>
          <label for="folder-input" class="file-btn">
            <span>📁 Adicionar Músicas</span>
            <input type="file" id="folder-input" multiple accept="audio/*">
          </label>
        </header>

        <div class="song-list-container">
          <ul id="song-list" class="song-list">
            <li class="empty-msg">Nenhuma música carregada. Clique em "Adicionar Músicas" para selecionar suas faixas.</li>
          </ul>
        </div>
      </section>

      <!-- ABA 3: CONFIGURAÇÕES -->
      <section id="tab-settings" class="tab-pane">
        <header class="library-header">
          <h3>Configurações</h3>
        </header>

        <div class="settings-content">
          <!-- Alternar Tema -->
          <div class="setting-item">
            <span>Tema da Interface</span>
            <button id="btn-theme-toggle" class="setting-action-btn">☀️ Mudar para Claro</button>
          </div>

          <!-- Escolher Wallpaper -->
          <div class="setting-item">
            <span>Plano de Fundo (Wallpaper)</span>
            <label for="wallpaper-input" class="setting-action-btn file-label">
              🖼️ Escolher Imagem
              <input type="file" id="wallpaper-input" accept="image/*">
            </label>
          </div>
          
          <div class="setting-item reset-wp">
            <button id="btn-reset-wallpaper" class="setting-action-btn secondary">Restaurar Wallpaper Original</button>
          </div>

          <!-- Configuração de Crossfade -->
          <div class="setting-item">
            <span>Crossfade (Segundos)</span>
            <div style="display: flex; align-items: center; gap: 10px;">
              <span id="crossfade-value">0s</span>
              <input type="range" id="crossfade-range" min="0" max="10" value="0" step="1" style="width: 100px;">
            </div>
          </div>
        </div>
      </section>

    </div>

    <!-- Dois elementos de áudio para permitir a transição cruzada (crossfade) -->
    <audio id="audio-player-1"></audio>
    <audio id="audio-player-2"></audio>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/jotaplayer/sw.js', { scope: '/jotaplayer/' })
          .then((reg) => console.log('Service Worker registrado:', reg.scope))
          .catch((err) => console.log('Erro no Service Worker:', err));
      });
    }
  </script>
</body>
</html>
